name: Build and publish Docker image

on:
  push:
    branches:
      - master
    tags:
      - '*.*.*'
  workflow_dispatch:

env:
  IMAGE_NAME: crowly/aun-filestore

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # The project versions as X.Y.Z.N (4-part), which the semver rules
          # below cannot parse - so without type=ref a release tag yields no
          # image tag at all and build-push-action fails with "tag is needed
          # when pushing to registry". type=ref,event=tag uses the tag name
          # verbatim and is the one that actually fires for our releases.
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
