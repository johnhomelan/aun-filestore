name: Build ipk

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (X.Y.Z). Defaults to a dev version.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  ipk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          V="${{ github.event.release.tag_name || inputs.version }}"
          V="${V#v}"
          [ -n "$V" ] || V="0.0.0.$(date +%Y%m%d%H%M%S)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building .ipk $V"

      - name: Build .ipk
        run: |
          docker run --rm \
            -v "$PWD":/work -w /work \
            -e IPK_VERSION="${{ steps.ver.outputs.version }}" \
            -e OUTPUT_DIR="/work/build" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            debian:stable-slim \
            sh packaging/ipk/build-in-container.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: build/*.ipk
          if-no-files-found: error

      - name: Attach to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.ipk

  verify-openwrt:
    needs: ipk
    runs-on: ubuntu-latest
    steps:
      - name: Download the .ipk
        uses: actions/download-artifact@v4
        with:
          name: ipk
          path: ipk

      - name: opkg install / remove in OpenWrt
        run: |
          docker run --rm -v "$PWD/ipk":/ipk openwrt/rootfs:x86-64-23.05.5 sh -eux -c '
            mkdir -p /var/lock /var/run
            opkg install --force-depends --force-postinst /ipk/*.ipk
            test -x /etc/init.d/aun-filestored
            test -x /etc/init.d/aun-dnsd
            head -1 /etc/init.d/aun-filestored | grep -q "/etc/rc.common"
            ! /etc/init.d/aun-filestored enabled
            opkg remove aun-filestored
            ! ls /etc/init.d/aun-filestored
          '

  verify-alpine:
    needs: ipk
    runs-on: ubuntu-latest
    steps:
      - name: Download the .ipk
        uses: actions/download-artifact@v4
        with:
          name: ipk
          path: ipk

      - name: Extract + run postinst on Alpine (no opkg on Alpine)
        run: |
          docker run --rm -v "$PWD/ipk":/ipk alpine:latest sh -eux -c '
            apk add --no-cache openrc tar >/dev/null
            cd /tmp && tar xzf /ipk/*.ipk
            tar xzf data.tar.gz -C /
            tar xzf control.tar.gz
            sh ./postinst configure
            test -x /etc/init.d/aun-filestored
            head -1 /etc/init.d/aun-filestored | grep -q openrc-run
            grep -q "need net aun-filestored" /etc/init.d/aun-dnsd
            for s in /etc/init.d/aun-*; do sh -n "$s"; done
          '
