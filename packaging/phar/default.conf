# Sample configuration for the phar distribution.
# All paths are relative to the directory you launch the server from
# (run.sh / `php filestore.phar -c .`).  See docs/Config.md for every option.

# --- authentication ---------------------------------------------------
security_plugin_file_user_file="users.txt"

# --- AUN / networking ------------------------------------------------
#aunmap_file="aunmap.txt"
aunmap_autonet=200

# --- admin web front end --------------------------------------------
webadmin_listen_address="0.0.0.0"
webadmin_listen_port=8080

# --- printing -------------------------------------------------------
print_server_spool_dir="print-spool"

# --- logging ---------------------------------------------------------
logfile="filestored.log"

# --- virtual file system ------------------------------------------
vfs_plugins='DfsSsd,AdfsAdl,LocalFile'
vfs_plugin_localfile_root="file-root"
vfs_plugin_localadfsadl_root="file-root"
vfs_plugin_localdfsssd_root="file-root"
