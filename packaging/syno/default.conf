# AUN Filestore - default configuration for the Synology package.
#
# This file is copied to /var/packages/aun-filestored/etc/default.conf on first
# install and is never overwritten afterwards. Edit it there, then restart the
# package from Package Center. Any *.conf file in that directory is read.
#
# See docs/Config.md for the full list of options.

# --- authentication -------------------------------------------------------
security_plugin_file_user_file="/var/packages/aun-filestored/etc/users.txt"

# --- AUN / networking ----------------------------------------------------
aunmap_file="/var/packages/aun-filestored/etc/aunmap.txt"
aunmap_autonet=200

# --- admin web front end ----------------------------------------------------
# The DSM desktop icon and Package Center "Open" button both point at this.
webadmin_listen_address="0.0.0.0"
webadmin_listen_port=8080

# --- printing -----------------------------------------------------------
print_server_spool_dir="/var/packages/aun-filestored/var/print-spool"

# --- logging ----------------------------------------------------------------
logfile="/var/packages/aun-filestored/var/aun-filestored.log"

# --- virtual file system --------------------------------------------------
# Point these at a shared folder (e.g. /volume1/econet) if you want the econet
# file tree to live on a normal Synology share.
vfs_plugins='DfsSsd,AdfsAdl,LocalFile'
vfs_plugin_localfile_root="/var/packages/aun-filestored/var/root"
vfs_plugin_localadfsadl_root="/var/packages/aun-filestored/var/root"
vfs_plugin_localdfsssd_root="/var/packages/aun-filestored/var/root"
