# TypePHP (swoole/typephp) build configuration for sql-serverd.
#
#   make sql-typephp                 -> podman build + a --dry transpile
#   TYPEPHP_DRY=0 make sql-typephp   -> full build: compile + link the binary
#
# sql-serverd hosts Services\Provider\SqlServer over the Remote Provider
# Protocol - structured identically to ecosyslogd. Unlike ecosyslogd it has no
# Monolog dependency, so instead of a hand-written main it runs the REAL
# HomeLan\FileStore\Command\SqlServerd class directly (staged copy, file-scope
# system.inc.php include stripped), the same way dns-typephp / ntp-typephp run
# Command\Dnsd / Command\Ntpd. The Symfony Console base + ReactPHP loop factory
# it needs are compile-only shims (shims/{symfony_console,console_runtime,
# react_eventloop_factory,safe_define}.php).
#
# Engines: SQLite, PostgreSQL and MySQL/MariaDB - the Containerfile builds the
# php:8.4-cli-bookworm base with pdo_sqlite (stock) plus pdo_pgsql + pdo_mysql
# (docker-php-ext-install), so all three drivers are in the libphp tpc links.
# DatabaseRegistry still rejects a database whose engine's PDO driver is not
# loaded with a clear RuntimeException.
#
# The vendored ReactPHP / Ratchet source set + ignore list are copied verbatim
# from project.ecosyslogd.yml (RemoteProvider\Client/Host + pawl + the full
# stack, already brought in for that build). See packaging/typephp/PORTING-REACT.md.
name: sql-serverd
mode: bin
php-version: "8.5"
optimize: 2
job: 4
cxx-std: c++17
sources:
  - main-sql-serverd.php
  - shims/signals.php
  - shims/pcntl_posix.stub.php
  - shims/pcntl_posix.cc
  - shims/StderrLogger.php
  - shims/deprecation_contracts.php
  # run the real Command\SqlServerd class rather than re-implement it
  - shims/symfony_console.php
  - shims/console_runtime.php
  - shims/react_eventloop_factory.php
  - shims/safe_define.php
  - ../../build/typephp/stage/cmd/SqlServerd.php

  # config: the class + the generated const defaults (see build-typephp.sh)
  - ../../src/include/classes/config.php
  - ../../build/typephp/stage/config_defines.php

  # psr/log contract
  - ../../build/typephp/stage/vendor/psr/log/Psr/Log/LoggerInterface.php

  # --- the project's own domain code (mirrors project.ecosyslogd.yml) -------
  - ../../src/include/classes/Messages
  - ../../src/include/classes/Encapsulation
  - ../../src/include/classes/Ntp
  - ../../src/include/classes/Dns
  - ../../src/include/classes/Aun
  - ../../src/include/classes/Piconet
  - ../../src/include/classes/RemoteProvider
  - ../../src/include/classes/RemoteSocket
  - ../../src/include/classes/RemoteBridge
  - ../../src/include/classes/WebSocket
  - ../../src/include/classes/Authentication
  - ../../src/include/classes/Vfs
  # Acorn disk-image readers used by the ADFS/DFS/MDFS/AFS VFS plugins
  - ../../src/vendor/homelan/acorn-disk/src/AdfsReader.php
  - ../../src/vendor/homelan/acorn-disk/src/AdfsReaderHD.php
  - ../../src/vendor/homelan/acorn-disk/src/DfsReader.php
  - ../../src/vendor/homelan/l3fsreader/src/L3fsReader.php
  - ../../src/vendor/homelan/mdfs-disk-reader/src/MdfsReader.php
  - ../../src/vendor/homelan/mdfs-disk-reader/src/MdfsWriter.php
  - ../../src/include/classes/Services
  - ../../src/include/classes/React

  # --- Stage 1-2 vendored ReactPHP -----------------------------------------
  - ../../build/typephp/stage/vendor/evenement/evenement/src
  - ../../build/typephp/stage/vendor/react/promise/src
  - ../../build/typephp/stage/vendor/react/event-loop/src/TimerInterface.php
  - ../../build/typephp/stage/vendor/react/event-loop/src/Timer
  - ../../build/typephp/stage/vendor/react/event-loop/src/Tick
  - ../../build/typephp/stage/vendor/react/event-loop/src/SignalsHandler.php
  - ../../build/typephp/stage/vendor/react/event-loop/src/LoopInterface.php
  - ../../build/typephp/stage/vendor/react/event-loop/src/StreamSelectLoop.php
  - ../../build/typephp/stage/vendor/react/stream/src
  - ../../build/typephp/stage/vendor/react/socket/src/ConnectionInterface.php
  - ../../build/typephp/stage/vendor/react/socket/src/ServerInterface.php
  - ../../build/typephp/stage/vendor/react/socket/src/ConnectorInterface.php
  - ../../build/typephp/stage/vendor/react/socket/src/Connection.php
  - ../../build/typephp/stage/vendor/react/socket/src/TcpServer.php
  - ../../build/typephp/stage/vendor/react/socket/src/UnixServer.php
  - ../../build/typephp/stage/vendor/react/socket/src/TcpConnector.php
  - ../../build/typephp/stage/vendor/react/socket/src/UnixConnector.php
  - ../../build/typephp/stage/vendor/react/socket/src/FixedUriConnector.php
  - ../../build/typephp/stage/vendor/react/socket/src/LimitingServer.php
  - ../../build/typephp/stage/vendor/react/datagram/src
  - ../../build/typephp/stage/vendor/react/child-process/src

  # --- Stage 6: async DNS resolver + the full Connector facade -----------
  - ../../build/typephp/stage/vendor/react/cache/src
  - ../../build/typephp/stage/vendor/react/dns/src
  - ../../build/typephp/stage/vendor/react/socket/src/DnsConnector.php
  - ../../build/typephp/stage/vendor/react/socket/src/HappyEyeBallsConnector.php
  - ../../build/typephp/stage/vendor/react/socket/src/HappyEyeBallsConnectionBuilder.php
  - ../../build/typephp/stage/vendor/react/socket/src/TimeoutConnector.php
  - ../../build/typephp/stage/vendor/react/socket/src/Connector.php
  - ../../build/typephp/stage/vendor/ratchet/pawl/src/Connector.php
  - ../../build/typephp/stage/vendor/ratchet/pawl/src/WebSocket.php
