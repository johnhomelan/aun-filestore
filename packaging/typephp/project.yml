# TypePHP (swoole/typephp) build configuration for aun-filestored.
#
#   make typephp            -> podman build + a --dry transpile (generate C++)
#   TYPEPHP_DRY=0 make typephp  -> full build: compile + link the native binary
#
# This builds the REAL native daemon: main.php (a de-dynamised port of
# Command\React::MainLoop) + the project's own domain code + the vendored
# ReactPHP event loop / sockets / datagram and the Ratchet WebSocket stack
# (guzzlehttp/psr7 + ratchet/rfc6455 + cboden/ratchet). See
# packaging/typephp/PORTING-REACT.md for how each piece was brought in and
# packaging/typephp/vendor-patches/ for the (small) vendor changes.
#
# Replaced by shims (nothing runs interpreted - a bin-mode binary has no PHP
# interpreter): Monolog -> shims/StderrLogger.php; aws-sdk-php -> shims/aws_s3_client.php;
# ext-ldap -> shims/ldap_openldap.cc; ext-pcntl/posix -> shims/pcntl_posix.cc;
# smarty/smarty -> shims/smarty_runtime.php + a build-time template transform;
# Symfony HttpKernel / DI / Routing -> a fixed-route dispatcher. Symfony
# HttpFoundation IS the real component (Response side compiled verbatim bar two
# hand-patched files; only Request + BinaryFileResponse stay shimmed). See
# PORTING-REACT.md "Stage 10d". The web admin UI, the Piconet serial interface
# and the outbound RemoteBridge client are all compiled and wired.
name: aun-filestored
mode: bin
php-version: "8.5"
optimize: 2
job: 4
cxx-std: c++17

# The ldap_* shim (shims/ldap_openldap.cc) is implemented against the OpenLDAP
# client library so the AuthPluginLdap / LdapClient auth backend is native.
link-libs:
  - ldap
  - lber

sources:
  - main.php
  - shims/signals.php
  - shims/pcntl_posix.stub.php
  - shims/pcntl_posix.cc
  - shims/StderrLogger.php
  - shims/deprecation_contracts.php
  # ext-ldap replacement (OpenLDAP-backed) for AuthPluginLdap / LdapClient
  - shims/ldap_constants.php
  - shims/ldap_classes.php
  - shims/ldap_openldap.stub.php
  - shims/ldap_openldap.cc
  # aws-sdk-php replacement (curl + SigV4) for the S3 VFS plugin
  - shims/aws_s3_client.php

  # config: the class + the generated const defaults (see build-typephp.sh)
  - ../../src/include/classes/config.php
  - ../../build/typephp/stage/config_defines.php

  # psr/log contract
  - ../../build/typephp/stage/vendor/psr/log/Psr/Log/LoggerInterface.php

  # --- the project's own domain code (mirrors project.yml) ------------------
  - ../../src/include/classes/Messages
  - ../../src/include/classes/Encapsulation
  - ../../src/include/classes/Ntp
  - ../../src/include/classes/Dns
  - ../../src/include/classes/Aun
  - ../../src/include/classes/Piconet
  - ../../src/include/classes/RemoteProvider
  - ../../src/include/classes/RemoteSocket
  - ../../src/include/classes/RemoteBridge
  - ../../src/include/classes/WebSocket
  - ../../src/include/classes/Authentication
  - ../../src/include/classes/Vfs
  # Acorn disk-image readers used by the ADFS/DFS/MDFS/AFS VFS plugins
  - ../../src/vendor/homelan/acorn-disk/src/AdfsReader.php
  - ../../src/vendor/homelan/acorn-disk/src/AdfsReaderHD.php
  - ../../src/vendor/homelan/acorn-disk/src/DfsReader.php
  - ../../src/vendor/homelan/l3fsreader/src/L3fsReader.php
  - ../../src/vendor/homelan/mdfs-disk-reader/src/MdfsReader.php
  - ../../src/vendor/homelan/mdfs-disk-reader/src/MdfsWriter.php
  - ../../src/include/classes/Services
  - ../../src/include/classes/React

