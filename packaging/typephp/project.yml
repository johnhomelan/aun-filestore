  # --- Stage 10a: admin HTTP transport (react/http, plain HTTP - distinct
  # from Ratchet's HttpServer above, which only ever does the WS upgrade) --
  - ../../build/typephp/stage/vendor/ringcentral/psr7/src
  - ../../build/typephp/stage/vendor/react/http/src

  # --- Stage 10d: native admin UI (no Symfony HttpKernel/DI, no Smarty runtime)
  - shims/smarty_runtime.php              # \Smarty\* + Admin\Service\Smarty shim
  - shims/symfony_httpfoundation.php      # Request + BinaryFileResponse only now
  # --- real symfony/http-foundation, Response side (see PORTING-REACT.md "Stage
  # 10d - http-foundation"). Two files are hand-patched copies; the rest compile
  # verbatim from src/vendor. Request + BinaryFileResponse stay in the shim above.
  - shims/symfony_response.php            # patched: drop file-scope class_exists, de-hook $headers
  - shims/symfony_headerutils.php         # patched: stub parseQuery, rename a groupParts loop var
  - ../../src/vendor/symfony/http-foundation/RedirectResponse.php
  - ../../src/vendor/symfony/http-foundation/ResponseHeaderBag.php
  - ../../src/vendor/symfony/http-foundation/HeaderBag.php
  - ../../src/vendor/symfony/http-foundation/Cookie.php
  - ../../src/vendor/symfony/http-foundation/ParameterBag.php
  - ../../src/vendor/symfony/http-foundation/InputBag.php
  - ../../src/vendor/symfony/http-foundation/Exception/ExceptionInterface.php
  - ../../src/vendor/symfony/http-foundation/Exception/RequestExceptionInterface.php
  - ../../src/vendor/symfony/http-foundation/Exception/BadRequestException.php
  - ../../src/vendor/symfony/http-foundation/Exception/UnexpectedValueException.php
