; Virtual printer configuration for aun-filestore print server.
;
; Each [SECTION] defines one virtual printer.  The section name is the printer
; name as seen by Econet clients (1-6 uppercase characters).
;
; behavior values:
;   spool   - save the raw print data to the spool directory, no conversion
;   script  - save the raw data then launch the conversion script asynchronously
;   discard - accept the job and drop it (useful for testing or a /dev/null queue)
;
; script    - path to a conversion command; %source% and %destination% are
;             substituted at run time.  Leave blank to use the global
;             print_server_conversion_script config value.
;
; allowed_users - comma-separated list of usernames that may use this printer.
;                 Leave blank to allow all authenticated users.
;
; Scripts are always run asynchronously via ReactPHP so they never block the
; server from servicing other Econet clients.

[PRINT]
description   = Default printer
enabled       = yes
behavior      = script
script        =
allowed_users =
